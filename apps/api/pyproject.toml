[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garner-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "google-genai>=2.9.0",
    "httpx>=0.28.0",
    "PyJWT>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "supabase>=2.10.0",
    "openai>=1.60.0", # used as OpenRouter client (OpenAI-compatible SDK)
    "sentry-sdk[fastapi]>=2.0.0",
    "apify-client>=1.8.0",
    "python-multipart>=0.0.9",
    "Pillow>=11.0.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "flashrank>=0.2.0",
    "jieba>=0.42.1",
]

# dev 依賴放 [dependency-groups]（PEP 735）而非 [project.optional-dependencies]。
# 差別很重要：`uv sync` 預設就會裝 dependency-groups 的 dev，但 extras 必須額外
# 加 --extra dev 才會裝——CI 當初 pytest 抓不到就是踩這個洞。
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ipykernel>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

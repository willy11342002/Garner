services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: garner
      POSTGRES_PASSWORD: garner
      POSTGRES_DB: garner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garner -d garner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://garner:garner@db:5432/garner
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: sh entrypoint.sh

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:

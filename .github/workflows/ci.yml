name: CI

# 同時掛 push 與 pull_request：本專案的實際流程是直接推 main（不開 PR），
# 只掛 pull_request 的話 CI 等於從來沒跑過——2026-08 之前就是這樣，
# lint-web 長期是壞的（缺 eslint.config.mjs、exit 2）卻沒有人看得到。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同一個 ref 只跑最新一次，避免連續推送時堆積。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 版本由 packageManager 欄位決定。必須指定路徑：repo 根目錄沒有 package.json，
          # 不指定的話 action 會找不到版本而失敗。
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # postinstall 會跑 nuxt prepare，產生 .nuxt/eslint.config.mjs 與型別，
      # lint 與 typecheck 都依賴它。
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.11'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked          # 預設含 dev group，pytest 在裡面
      - name: Run tests
        run: uv run pytest tests/ -v

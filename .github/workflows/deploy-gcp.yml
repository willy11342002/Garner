name: Deploy Transcriber (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'apps/gcp/**'
      - '.github/workflows/deploy-gcp.yml'

env:
  PROJECT_ID: vela-497610
  REGION: asia-east1
  SERVICE: vela-transcriber
  IMAGE: ghcr.io/${{ github.repository_owner }}/vela-transcriber
  CLOUD_RUN_IMAGE: asia-east1-docker.pkg.dev/vela-497610/ghcr-proxy/${{ github.repository_owner }}/vela-transcriber

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: apps/gcp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vela-transcriber:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vela-transcriber:latest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.CLOUD_RUN_IMAGE }}:${{ github.sha }}
          timeout: 300s
          flags: "--allow-unauthenticated"
          env_vars: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            API_SECRET=${{ secrets.TRANSCRIBER_SECRET }}

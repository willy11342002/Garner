name: Deploy Transcriber (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'apps/gcp/**'
      - '.github/workflows/deploy-gcp.yml'

env:
  PROJECT_ID: vela-497610
  REGION: asia-east1
  SERVICE: vela-transcriber
  IMAGE: asia-east1-docker.pkg.dev/vela-497610/vela/vela-transcriber

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build & push image
        working-directory: apps/gcp
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          timeout: 300s
          env_vars: |
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            API_SECRET=${{ secrets.TRANSCRIBER_SECRET }}
